name: AI Batching PR Description (OpenAI - Modular)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate_pr_description:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPO: ${{ github.repository }}
      BATCH_SIZE: 150

    steps:
      # ========================================
      # PRE-STEP: Install jq
      # ========================================
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # ========================================
      # BLOCK 1: CODE CHECKOUT & VALIDATION (FIXED)
      # ========================================
      - name: "Block 1.1: Checkout repository and set PR branch"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }} # Always checkout the PR branch to avoid detached HEAD

      - name: "Block 1.2: Validate environment variables"
        run: |
          echo "Validating required environment variables..."
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY is not set"
            exit 1
          fi
          echo "✅ OPENAI_API_KEY is set"
          echo "✅ PR Number: $GITHUB_PR_NUMBER"
          echo "✅ Repository: $GITHUB_REPO"
          echo "✅ Batch Size: $BATCH_SIZE"

      # ========================================
      # BLOCK 2: DIFF EXTRACTION & COMBINATION
      # ========================================
      - name: "Block 2.1: Extract git diff"
        run: |
          echo "Extracting git diff between base and head..."
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > diff.txt
          echo "Git diff extracted. Size: $(wc -l < diff.txt) lines"

      - name: "Block 2.2: Fetch GitHub API diff"
        run: |
          echo "Fetching structured diff from GitHub API..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/files" > files_diff.json
          echo "API diff fetched. Files changed: $(jq length files_diff.json)"

      - name: "Block 2.3: Combine both diffs into JSON"
        run: |
          echo "Combining git diff and API diff..."
          jq -n --arg gitdiff "$(cat diff.txt)" --argjson apidiff "$(cat files_diff.json)" \
            '{gitdiff: $gitdiff, apidiff: $apidiff}' > combined_diff.json
          echo "Combined diff created. Size: $(du -h combined_diff.json | cut -f1)"

      # ========================================
      # BLOCK 3: CHANGE DETECTION & VALIDATION
      # ========================================
      - name: "Block 3.1: Check for meaningful changes"
        id: change_detection
        run: |
          echo "Checking for meaningful changes..."
          if [ -s diff.txt ]; then
            line_count=$(wc -l < diff.txt)
            echo "Changes detected: $line_count lines"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "line_count=$line_count" >> $GITHUB_OUTPUT
          else
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "line_count=0" >> $GITHUB_OUTPUT
          fi

      - name: "Block 3.2: Display change summary"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "📊 Change Summary:"
          echo "- Total lines changed: ${{ steps.change_detection.outputs.line_count }}"
          echo "- Batch size: $BATCH_SIZE lines"
          line_count="${{ steps.change_detection.outputs.line_count }}"
          estimated_batches=$(( (line_count + BATCH_SIZE - 1) / BATCH_SIZE ))
          echo "- Estimated batches: $estimated_batches"

      # ========================================
      # BLOCK 4: DIFF BATCHING & PREPARATION
      # ========================================
      - name: "Block 4.1: Split diff into batches"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Splitting diff into $BATCH_SIZE-line batches..."
          rm -f diff_batch_*
          split -l $BATCH_SIZE diff.txt diff_batch_
          batch_count=$(ls diff_batch_* 2>/dev/null | wc -l)
          echo "Created $batch_count batches"
          echo "BATCH_COUNT=$batch_count" >> $GITHUB_ENV

      - name: "Block 4.2: Validate batch creation"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Validating batch files..."
          for batch in diff_batch_*; do
            if [ -f "$batch" ]; then
              size=$(wc -l < "$batch")
              echo "- Batch $(basename "$batch"): $size lines"
            fi
          done

      # ========================================
      # BLOCK 5: OPENAI API AUTHENTICATION TEST
      # ========================================
      - name: "Block 5.1: Test OpenAI API connectivity"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Testing OpenAI API connectivity..."
          response=$(curl -s "https://api.openai.com/v1/models" \
            -H "Authorization: Bearer $OPENAI_API_KEY")
          if echo "$response" | jq -e '.data' > /dev/null 2>&1; then
            echo "✅ OpenAI API connection successful"
            model_count=$(echo "$response" | jq '.data | length')
            echo "Available models: $model_count"
          else
            echo "❌ OpenAI API connection failed"
            echo "Response: $response"
            exit 1
          fi

      # ========================================
      # BLOCK 6: BATCH PROCESSING & SUMMARIZATION
      # ========================================
      - name: "Block 6.1: Initialize batch processing"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Initializing batch processing..."
          rm -f batch_summaries.txt
          echo "PROCESSED_BATCHES=0" >> $GITHUB_ENV

      - name: "Block 6.2: Process each batch with OpenAI (IMPROVED ERROR HANDLING)"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Processing batches with OpenAI API..."
          processed=0
          for batch in diff_batch_*; do
            if [ -s "$batch" ]; then
              echo "Processing batch: $(basename "$batch")"
              diff_content=$(cat "$batch")
              payload=$(jq -n \
                --arg diff "$diff_content" \
                '{
                  model: "gpt-4o-mini",
                  messages: [
                    {role: "system", content: "You are a helpful assistant that summarizes git diffs for pull request descriptions. Focus on the key changes and their purpose."},
                    {role: "user", content: ("Summarize this git diff batch for a PR description:\n" + $diff)}
                  ],
                  max_tokens: 300,
                  temperature: 0.2
                }')
              
              response=$(curl -s "https://api.openai.com/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                -d "$payload")
              
              # Check for errors first
              if echo "$response" | jq -e '.error' > /dev/null 2>&1; then
                error_msg=$(echo "$response" | jq -r '.error.message')
                echo "❌ OpenAI API error: $error_msg"
                continue
              fi
              
              # Check if response has choices
              if echo "$response" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
                summary=$(echo "$response" | jq -r '.choices[0].message.content')
                echo "✅ Batch $(basename "$batch") processed successfully"
                echo "## Batch $(basename "$batch")" >> batch_summaries.txt
                echo "$summary" >> batch_summaries.txt
                echo "" >> batch_summaries.txt
                processed=$((processed + 1))
              else
                echo "❌ Unexpected response format for batch $(basename "$batch")"
                echo "Response: $response"
              fi
            fi
          done
          echo "PROCESSED_BATCHES=$processed" >> $GITHUB_ENV
          echo "Successfully processed $processed out of ${BATCH_COUNT:-0} batches"

      # ========================================
      # BLOCK 7: SUMMARY AGGREGATION & REPHRASING
      # ========================================
      - name: "Block 7.1: Validate batch summaries"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Validating batch summaries..."
          if [ -s batch_summaries.txt ]; then
            summary_lines=$(wc -l < batch_summaries.txt)
            echo "✅ Batch summaries file created: $summary_lines lines"
            echo "SUMMARIES_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "❌ No batch summaries generated"
            echo "SUMMARIES_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: "Block 7.2: Aggregate and rephrase summaries"
        if: steps.change_detection.outputs.has_changes == 'true' && env.SUMMARIES_AVAILABLE == 'true'
        run: |
          echo "Aggregating and rephrasing all summaries..."
          full_summary=$(cat batch_summaries.txt)
          payload=$(jq -n \
            --arg summary "$full_summary" \
            '{
              model: "gpt-4o-mini",
              messages: [
                {role: "system", content: "You are a helpful assistant that creates concise, professional pull request descriptions. Combine and rephrase the provided summaries into a coherent, well-structured PR description."},
                {role: "user", content: ("Please combine these batch summaries into a single, coherent PR description:\n" + $summary)}
              ],
              max_tokens: 400,
              temperature: 0.3
            }')
          response=$(curl -s "https://api.openai.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$payload")

          # Check for errors first
          if echo "$response" | jq -e '.error' > /dev/null 2>&1; then
            error_msg=$(echo "$response" | jq -r '.error.message')
            echo "❌ OpenAI API error for final description: $error_msg"
            echo "FINAL_DESCRIPTION_READY=false" >> $GITHUB_ENV
          elif echo "$response" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
            pr_desc=$(echo "$response" | jq -r '.choices[0].message.content')
            echo "✅ Final PR description generated successfully"
            echo "PR_DESCRIPTION<<EOF" >> $GITHUB_ENV
            echo "$pr_desc" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "FINAL_DESCRIPTION_READY=true" >> $GITHUB_ENV
          else
            echo "❌ Failed to generate final description - unexpected response format"
            echo "Response: $response"
            echo "FINAL_DESCRIPTION_READY=false" >> $GITHUB_ENV
          fi

      # ========================================
      # BLOCK 7B: GENERATE AI CODE REVIEW & TEST FILES
      # ========================================
      - name: "Block 7B.1: Generate AI Code Review"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Generating AI Code Review..."
          diff_content=$(cat diff.txt)
          payload=$(jq -n \
            --arg diff "$diff_content" \
            '{
              model: "gpt-4o-mini",
              messages: [
                {role: "system", content: "You are a strict senior code reviewer. Provide detailed review comments focusing on correctness, maintainability, performance, and potential improvements. Format your response as a markdown document with clear sections."},
                {role: "user", content: ("Generate a comprehensive code review for this diff:\n" + $diff)}
              ],
              max_tokens: 500,
              temperature: 0.2
            }')

          response=$(curl -s "https://api.openai.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$payload")

          # Check for errors first
          if echo "$response" | jq -e '.error' > /dev/null 2>&1; then
            error_msg=$(echo "$response" | jq -r '.error.message')
            echo "❌ OpenAI API error for code review: $error_msg"
          elif echo "$response" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
            review_text=$(echo "$response" | jq -r '.choices[0].message.content')
            echo "# 🤖 AI-Generated Code Review" > AI_PR_Code_Review.md
            echo "" >> AI_PR_Code_Review.md
            echo "$review_text" >> AI_PR_Code_Review.md
            echo "✅ AI Code Review generated and written to file"
          else
            echo "❌ Failed to generate code review - unexpected response format"
            echo "Response: $response"
          fi

      - name: "Block 7B.2: Generate AI Test Scenarios"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Generating AI Test Scenarios..."
          diff_content=$(cat diff.txt)
          payload=$(jq -n \
            --arg diff "$diff_content" \
            '{
              model: "gpt-4o-mini",
              messages: [
                {role: "system", content: "You are a test architect. Based on the provided code changes, generate a comprehensive set of test case scenarios covering unit tests, edge cases, integration points, and possible regressions. Format your response as a markdown document with clear sections and bullet points."},
                {role: "user", content: ("Generate detailed test case scenarios for this diff:\n" + $diff)}
              ],
              max_tokens: 500,
              temperature: 0.2
            }')

          response=$(curl -s "https://api.openai.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$payload")

          # Check for errors first
          if echo "$response" | jq -e '.error' > /dev/null 2>&1; then
            error_msg=$(echo "$response" | jq -r '.error.message')
            echo "❌ OpenAI API error for test scenarios: $error_msg"
          elif echo "$response" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
            test_text=$(echo "$response" | jq -r '.choices[0].message.content')
            echo "# 🧪 AI-Generated Test Case Scenarios" > AI_Test_Case_Scenarios.md
            echo "" >> AI_Test_Case_Scenarios.md
            echo "$test_text" >> AI_Test_Case_Scenarios.md
            echo "✅ AI Test Scenarios generated and written to file"
          else
            echo "❌ Failed to generate test scenarios - unexpected response format"
            echo "Response: $response"
          fi

      # ========================================
      # BLOCK 7C: UPLOAD AI FILES AS ARTIFACTS (NO REPO STORAGE)
      # ========================================
      - name: "Block 7C: Upload AI-generated files as artifacts"
        if: steps.change_detection.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-ai-files
          path: |
            AI_PR_Code_Review.md
            AI_Test_Case_Scenarios.md
          retention-days: 30
          if-no-files-found: warn

      - name: "Block 7D: Create artifact download URL"
        if: steps.change_detection.outputs.has_changes == 'true'
        id: artifact_info
        run: |
          WORKFLOW_RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "ARTIFACT_URL=$WORKFLOW_RUN_URL" >> $GITHUB_OUTPUT
          echo "✅ AI files uploaded as artifacts - accessible for 30 days"

      # ========================================
      # BLOCK 8: PR UPDATE & FINALIZATION (IMPROVED - WIPES OLD CONTENT)
      # ========================================
      - name: "Block 8.1: Fetch and clean current PR body"
        if: steps.change_detection.outputs.has_changes == 'true' && env.FINAL_DESCRIPTION_READY == 'true'
        run: |
          echo "Fetching current PR body..."
          current_body=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER" | jq -r '.body // ""')

          # Enhanced cleaning: Remove ALL AI-generated content patterns
          cleaned_body=$(echo "$current_body" | \
            sed '/^## 🤖 AI-Generated PR Description$/,$d' | \
            sed '/^📁 \*\*AI-Generated Files:\*\*/d' | \
            sed '/^PR Code review link:/d' | \
            sed '/^Test case scenarios:/d' | \
            sed '/^• 🤖 Code Review Analysis$/d' | \
            sed '/^• 🧪 Test Case Scenarios$/d' | \
            sed '/^\*Files available for [0-9][0-9]* days\*$/d' | \
            sed '/^---$/d' | \
            sed 's/[[:space:]]*$//')

          # Remove empty lines at the end
          cleaned_body=$(echo "$cleaned_body" | sed -e :a -e '/^\s*$/d;N;ba')

          echo "CURRENT_BODY<<EOF" >> $GITHUB_ENV
          echo "$cleaned_body" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [[ -n "$cleaned_body" && "$cleaned_body" != "null" ]]; then
            echo "✅ Existing PR body found and cleaned ($(echo "$cleaned_body" | wc -c) characters)"
          else
            echo "ℹ️ No existing PR body or empty after cleaning"
          fi

      - name: "Block 8.2: Update PR body with AI content and artifact links"
        if: steps.change_detection.outputs.has_changes == 'true' && env.FINAL_DESCRIPTION_READY == 'true'
        run: |
          set -e
          echo "Updating PR body with AI-generated content and artifact links..."

          # Create the AI section with artifact links
          echo "## 🤖 AI-Generated PR Description" > ai_section.txt
          echo "" >> ai_section.txt
          echo "${PR_DESCRIPTION}" >> ai_section.txt
          echo "" >> ai_section.txt
          echo "---" >> ai_section.txt
          echo "" >> ai_section.txt
          echo "📁 **AI-Generated Files:** [Download from Workflow Artifacts](${{ steps.artifact_info.outputs.ARTIFACT_URL }})" >> ai_section.txt
          echo "" >> ai_section.txt
          echo "• 🤖 Code Review Analysis" >> ai_section.txt
          echo "• 🧪 Test Case Scenarios" >> ai_section.txt
          echo "" >> ai_section.txt
          echo "*Files available for 30 days*" >> ai_section.txt
          ai_section=$(cat ai_section.txt)

          # Combine with existing body (if any)
          if [[ -n "$CURRENT_BODY" && "$CURRENT_BODY" != "null" && -n "$(echo "$CURRENT_BODY" | tr -d '[:space:]')" ]]; then
            echo "${ai_section}" > new_body.txt
            echo "" >> new_body.txt
            echo "---" >> new_body.txt
            echo "" >> new_body.txt
            echo "${CURRENT_BODY}" >> new_body.txt
            new_body=$(cat new_body.txt)
          else
            new_body="$ai_section"
          fi

          # Update PR with proper JSON escaping
          new_body_json=$(jq -Rs . <<< "$new_body")
          response=$(curl -s -X PATCH "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"body\": $new_body_json}")

          if echo "$response" | jq -e '.id' > /dev/null 2>&1; then
            echo "✅ PR body updated successfully with artifact links"
          else
            echo "❌ Failed to update PR body"
            echo "Response: $response"
            exit 1
          fi

      # ========================================
      # BLOCK 9: CLEANUP
      # ========================================
      - name: "Block 9.1: Cleanup temporary files"
        if: always() && steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Cleaning up temporary files..."
          rm -f diff.txt files_diff.json combined_diff.json batch_summaries.txt diff_batch_* AI_PR_Code_Review.md AI_Test_Case_Scenarios.md ai_section.txt new_body.txt
          echo "✅ Cleanup completed"
