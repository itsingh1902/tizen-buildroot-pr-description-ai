name: AI Batching PR Description (OpenAI - Modular)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate_pr_description:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPO: ${{ github.repository }}
      BATCH_SIZE: 150

    steps:
      # ========================================
      # PRE-STEP: Install jq
      # ========================================
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # ========================================
      # BLOCK 1: CODE CHECKOUT & VALIDATION
      # ========================================
      - name: "Block 1.1: Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Block 1.2: Validate environment variables"
        run: |
          echo "Validating required environment variables..."
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY is not set"
            exit 1
          fi
          echo "✅ OPENAI_API_KEY is set"
          echo "✅ PR Number: $GITHUB_PR_NUMBER"
          echo "✅ Repository: $GITHUB_REPO"
          echo "✅ Batch Size: $BATCH_SIZE"

      # ========================================
      # BLOCK 2: DIFF EXTRACTION & COMBINATION
      # ========================================
      - name: "Block 2.1: Extract git diff"
        run: |
          echo "Extracting git diff between base and head..."
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > diff.txt
          echo "Git diff extracted. Size: $(wc -l < diff.txt) lines"

      - name: "Block 2.2: Fetch GitHub API diff"
        run: |
          echo "Fetching structured diff from GitHub API..."
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/files" > files_diff.json
          echo "API diff fetched. Files changed: $(jq length files_diff.json)"

      - name: "Block 2.3: Combine both diffs into JSON"
        run: |
          echo "Combining git diff and API diff..."
          jq -n --arg gitdiff "$(cat diff.txt)" --argjson apidiff "$(cat files_diff.json)" \
            '{gitdiff: $gitdiff, apidiff: $apidiff}' > combined_diff.json
          echo "Combined diff created. Size: $(du -h combined_diff.json | cut -f1)"

      # ========================================
      # BLOCK 3: CHANGE DETECTION & VALIDATION
      # ========================================
      - name: "Block 3.1: Check for meaningful changes"
        id: change_detection
        run: |
          echo "Checking for meaningful changes..."
          if [ -s diff.txt ]; then
            line_count=$(wc -l < diff.txt)
            echo "Changes detected: $line_count lines"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "line_count=$line_count" >> $GITHUB_OUTPUT
          else
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "line_count=0" >> $GITHUB_OUTPUT
          fi

      - name: "Block 3.2: Display change summary"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "📊 Change Summary:"
          echo "- Total lines changed: ${{ steps.change_detection.outputs.line_count }}"
          echo "- Batch size: $BATCH_SIZE lines"
          # Calculate estimated batches with proper arithmetic
          line_count="${{ steps.change_detection.outputs.line_count }}"
          estimated_batches=$(( (line_count + BATCH_SIZE - 1) / BATCH_SIZE ))
          echo "- Estimated batches: $estimated_batches"

      # ========================================
      # BLOCK 4: DIFF BATCHING & PREPARATION
      # ========================================
      - name: "Block 4.1: Split diff into batches"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Splitting diff into $BATCH_SIZE-line batches..."
          rm -f diff_batch_*
          split -l $BATCH_SIZE diff.txt diff_batch_
          batch_count=$(ls diff_batch_* 2>/dev/null | wc -l)
          echo "Created $batch_count batches"
          echo "BATCH_COUNT=$batch_count" >> $GITHUB_ENV

      - name: "Block 4.2: Validate batch creation"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Validating batch files..."
          for batch in diff_batch_*; do
            if [ -f "$batch" ]; then
              size=$(wc -l < "$batch")
              echo "- Batch $(basename "$batch"): $size lines"
            fi
          done

      # ========================================
      # BLOCK 5: OPENAI API AUTHENTICATION TEST
      # ========================================
      - name: "Block 5.1: Test OpenAI API connectivity"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Testing OpenAI API connectivity..."
          response=$(curl -s "https://api.openai.com/v1/models" \
            -H "Authorization: Bearer $OPENAI_API_KEY")

          if echo "$response" | jq -e '.data' > /dev/null 2>&1; then
            echo "✅ OpenAI API connection successful"
            model_count=$(echo "$response" | jq '.data | length')
            echo "Available models: $model_count"
          else
            echo "❌ OpenAI API connection failed"
            echo "Response: $response"
            exit 1
          fi

      # ========================================
      # BLOCK 6: BATCH PROCESSING & SUMMARIZATION
      # ========================================
      - name: "Block 6.1: Initialize batch processing"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Initializing batch processing..."
          rm -f batch_summaries.txt
          echo "PROCESSED_BATCHES=0" >> $GITHUB_ENV

      - name: "Block 6.2: Process each batch with OpenAI"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Processing batches with OpenAI API..."
          processed=0

          for batch in diff_batch_*; do
            if [ -s "$batch" ]; then
              echo "Processing batch: $(basename "$batch")"
              
              # Properly escape diff content for JSON
              diff_content=$(cat "$batch" | jq -Rs .)
              
              response=$(curl -s "https://api.openai.com/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                -d "{
                  \"model\": \"gpt-4o-mini\",
                  \"messages\": [
                    {\"role\": \"system\", \"content\": \"You are a helpful assistant that summarizes git diffs for pull request descriptions. Focus on the key changes and their purpose.\"},
                    {\"role\": \"user\", \"content\": \"Summarize this git diff batch for a PR description:\\n\" + $diff_content}
                  ],
                  \"max_tokens\": 300,
                  \"temperature\": 0.2
                }")
              
              if echo "$response" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
                summary=$(echo "$response" | jq -r '.choices[0].message.content')
                echo "✅ Batch $(basename "$batch") processed successfully"
                echo "## Batch $(basename "$batch")" >> batch_summaries.txt
                echo "$summary" >> batch_summaries.txt
                echo "" >> batch_summaries.txt
                processed=$((processed + 1))
              else
                echo "❌ Failed to process batch $(basename "$batch")"
                echo "Response: $response"
              fi
            fi
          done

          echo "PROCESSED_BATCHES=$processed" >> $GITHUB_ENV
          echo "Successfully processed $processed out of ${BATCH_COUNT:-0} batches"

      # ========================================
      # BLOCK 7: SUMMARY AGGREGATION & REPHRASING
      # ========================================
      - name: "Block 7.1: Validate batch summaries"
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Validating batch summaries..."
          if [ -s batch_summaries.txt ]; then
            summary_lines=$(wc -l < batch_summaries.txt)
            echo "✅ Batch summaries file created: $summary_lines lines"
            echo "SUMMARIES_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "❌ No batch summaries generated"
            echo "SUMMARIES_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: "Block 7.2: Aggregate and rephrase summaries"
        if: steps.change_detection.outputs.has_changes == 'true' && env.SUMMARIES_AVAILABLE == 'true'
        run: |
          echo "Aggregating and rephrasing all summaries..."

          # Properly escape full summary for JSON
          full_summary=$(cat batch_summaries.txt | jq -Rs .)

          response=$(curl -s "https://api.openai.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"You are a helpful assistant that creates concise, professional pull request descriptions. Combine and rephrase the provided summaries into a coherent, well-structured PR description.\"},
                {\"role\": \"user\", \"content\": \"Please combine these batch summaries into a single, coherent PR description:\\n\" + $full_summary}
              ],
              \"max_tokens\": 400,
              \"temperature\": 0.3
            }")

          if echo "$response" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
            pr_desc=$(echo "$response" | jq -r '.choices[0].message.content')
            echo "✅ Final PR description generated successfully"
            echo "PR_DESCRIPTION<<EOF" >> $GITHUB_ENV
            echo "$pr_desc" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "FINAL_DESCRIPTION_READY=true" >> $GITHUB_ENV
          else
            echo "❌ Failed to generate final description"
            echo "Response: $response"
            echo "FINAL_DESCRIPTION_READY=false" >> $GITHUB_ENV
          fi

      # ========================================
      # BLOCK 8: PR UPDATE & FINALIZATION
      # ========================================
      - name: "Block 8.1: Fetch current PR body"
        if: steps.change_detection.outputs.has_changes == 'true' && env.FINAL_DESCRIPTION_READY == 'true'
        run: |
          echo "Fetching current PR body..."
          current_body=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER" | jq -r '.body // ""')

          echo "CURRENT_BODY<<EOF" >> $GITHUB_ENV
          echo "$current_body" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [[ -n "$current_body" && "$current_body" != "null" ]]; then
            echo "✅ Existing PR body found ($(echo "$current_body" | wc -c) characters)"
          else
            echo "ℹ️ No existing PR body"
          fi

      - name: "Block 8.2: Update PR with AI description"
        if: steps.change_detection.outputs.has_changes == 'true' && env.FINAL_DESCRIPTION_READY == 'true'
        run: |
          set -e
          echo "Updating PR body with AI-generated description..."

          # Prepare new body using printf for safe multi-line content
          if [[ -z "$CURRENT_BODY" || "$CURRENT_BODY" == "null" ]]; then
            new_body="$PR_DESCRIPTION"
          else
            new_body=$(printf "## 🤖 AI-Generated PR Description\n\n%s\n\n---\n\n%s" "$PR_DESCRIPTION" "$CURRENT_BODY")
          fi

          # Update PR with proper JSON escaping
          new_body_json=$(jq -Rs . <<< "$new_body")
          response=$(curl -s -X PATCH "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"body\": $new_body_json}")
            
          if echo "$response" | jq -e '.id' > /dev/null 2>&1; then
            echo "✅ PR updated successfully"
          else
            echo "❌ Failed to update PR"
            echo "Response: $response"
            exit 1
          fi

      # ========================================
      # BLOCK 9: CLEANUP
      # ========================================
      - name: "Block 9.1: Cleanup temporary files"
        if: always() && steps.change_detection.outputs.has_changes == 'true'
        run: |
          echo "Cleaning up temporary files..."
          rm -f diff.txt files_diff.json combined_diff.json batch_summaries.txt diff_batch_*
          echo "✅ Cleanup completed"