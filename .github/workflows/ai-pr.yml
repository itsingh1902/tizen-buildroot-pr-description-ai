name: AI Automated PR Review with Inline Comments

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai_pr_review:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPO: ${{ github.repository }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate environment
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY is required"
            exit 1
          fi

      - name: Fetch PR files and patches
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/files" \
            > pr_files.json

      - name: Parse diff hunks in Bash and extract changed lines
        run: |
          echo "{}" > line_mappings.json

          jq -c '.[] | select(.patch != null) | {path: .filename, patch: .patch}' pr_files.json |
          while read -r file; do
            path=$(echo "$file" | jq -r '.path')
            patch=$(echo "$file" | jq -r '.patch')
            new_line=0
            added_lines=()

            while IFS= read -r line; do
              if [[ $line =~ ^@@\ -(.*)\ \+(.*)\ @@ ]]; then
                hunk_info=${BASH_REMATCH[2]}
                new_line=${hunk_info%%,*}
                continue
              fi
              if [[ $line =~ ^\+ ]] && [[ ! $line =~ ^\+\+\+ ]]; then
                added_lines+=("$new_line")
                ((new_line++))
              elif [[ $line =~ ^- ]] && [[ ! $line =~ ^\-\-\- ]]; then
                continue
              else
                ((new_line++))
              fi
            done < <(printf '%s\n' "$patch")

            if [ ${#added_lines[@]} -gt 0 ]; then
              file_obj=$(jq -n \
                --arg path "$path" \
                --arg patch "$patch" \
                --argjson lines "$(printf '%s\n' "${added_lines[@]}" | jq -R . | jq -cs .)" \
                '{path: $path, patch: $patch, changed_lines: $lines}')
              jq --argjson obj "$file_obj" '. + {($obj.path): obj}' line_mappings.json > tmp && mv tmp line_mappings.json
              echo "📍 $path → lines ${added_lines[*]:0:10}${#added_lines[@] > 10 ? "…" : ""}"
            fi
          done

      - name: Generate AI review comments via OpenAI
        run: |
          echo "[]" > ai_comments.json

          cat line_mappings.json | jq -c 'to_entries[]' |
          while read -r entry; do
            path=$(echo "$entry" | jq -r '.value.path')
            patch=$(echo "$entry" | jq -r '.value.patch')
            changed_lines=$(echo "$entry" | jq -r '.value.changed_lines[]')

            escaped_patch=$(echo "$patch" | jq -Rs .)

            ai_response=$(curl -s https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"model\": \"gpt-4o-mini\",
                \"messages\": [
                  {\"role\":\"system\",\"content\":\"You are an expert code reviewer. Analyze the provided git patch and generate inline review comments focusing on code quality, best practices, security, performance, and test scenarios. Only comment on lines added (‘+’). Return a JSON array like [{\\\"line\\\":<line>,\\\"body\\\":\\\"comment text\\\"}]. If no suggestions, return [].\"},
                  {\"role\":\"user\",\"content\":\"File: $path\nPatch:\n$escaped_patch\"}
                ],
                \"max_tokens\": 800,
                \"temperature\": 0.1
              }")

            content=$(echo "$ai_response" | jq -r '.choices[0].message.content')
            suggestions=$(echo "$content" | sed -n '/\[/,/\]/p' | jq '.' 2>/dev/null || echo "[]")

            count=$(echo "$suggestions" | jq 'length')
            if [ "$count" -gt 0 ]; then
              formatted=$(echo "$suggestions" | jq --arg p "$path" '
                map({path: $p, line: .line, side: "RIGHT", body: .body})')
              jq --argjson new "$formatted" '. + $new' ai_comments.json > tmp && mv tmp ai_comments.json
              echo "✅ $count suggestions for $path"
            fi
          done

      - name: Post inline comments to PR
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          total=$(jq 'length' ai_comments.json)

          if [ "$total" -gt 0 ]; then
            echo "Posting $total inline comments..."
            jq -c '.[]' ai_comments.json |
            while read -r c; do
              path=$(echo "$c" | jq -r '.path')
              line=$(echo "$c" | jq -r '.line')
              body=$(echo "$c" | jq -r '.body')
              curl -s -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/comments" \
                -d "$(jq -n --arg b "$body" --arg p "$path" --arg c "$COMMIT_SHA" --argjson l "$line" '{body:$b, commit_id:$c, path:$p, line:$l, side:"RIGHT"}')"
            done
          else
            echo "ℹ️ No inline comments generated—code looks good!"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f pr_files.json line_mappings.json ai_comments.json tmp