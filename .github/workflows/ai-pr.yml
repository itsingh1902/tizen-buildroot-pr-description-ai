name: AI Automated PR Review with Inline Comments
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai_pr_review:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPO: ${{ github.repository }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update && sudo apt-get install -y gh

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate environment
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY is not set"
            exit 1
          fi

      - name: Extract PR changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "BASE_SHA=$BASE_SHA" >> $GITHUB_ENV
          echo "HEAD_SHA=$HEAD_SHA" >> $GITHUB_ENV

          # Get detailed file changes with line numbers for inline comments
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/files" \
            > pr_files.json

      - name: Generate AI inline comments
        run: |
          echo "🤖 Analyzing code changes for inline review..."
          
          # Initialize results
          echo "[]" > inline_comments.json
          total_comments=0

          # Process each file with patches
          cat pr_files.json | jq -c '.[] | select(.patch != null)' | while read -r file_data; do
            filename=$(echo "$file_data" | jq -r '.filename')
            patch=$(echo "$file_data" | jq -r '.patch')
            
            echo "📝 Analyzing: $filename"
            
            # Extract added lines from patch for precise line targeting
            added_lines=$(echo "$patch" | grep -n "^+" | grep -v "^+++" | sed 's/^\([0-9]*\):+/\1:/' || true)
            
            if [ -z "$added_lines" ]; then
              echo "ℹ️ No added lines found in $filename"
              continue
            fi

            # Create enhanced AI prompt for comprehensive review including test scenarios
            escaped_patch=$(echo "$patch" | jq -Rs .)
            escaped_filename=$(echo "$filename" | jq -Rs .)
            
            ai_response=$(curl -s https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"model\": \"gpt-4o-mini\",
                \"messages\": [
                  {
                    \"role\": \"system\",
                    \"content\": \"You are an expert code reviewer. Analyze the git patch and provide specific inline comments for code quality, security, performance, best practices, and test scenarios. Focus ONLY on lines that start with '+' (new/changed code). For each suggestion, specify the exact line number where it should appear in the diff. Return a JSON array with objects: [{\\\"path\\\": \\\"filename\\\", \\\"line\\\": line_number, \\\"side\\\": \\\"RIGHT\\\", \\\"body\\\": \\\"detailed_comment_with_suggestions_and_test_scenarios\\\"}]. If no issues found, return [].\"
                  },
                  {
                    \"role\": \"user\",
                    \"content\": \"Review this code change and suggest improvements including potential test scenarios:\\n\\nFile: $escaped_filename\\n\\nPatch:\\n$escaped_patch\"
                  }
                ],
                \"max_tokens\": 800,
                \"temperature\": 0.1
              }")

            # Process AI response and extract valid comments
            if echo "$ai_response" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
              ai_content=$(echo "$ai_response" | jq -r '.choices[0].message.content')
              
              # Try to parse as JSON array
              if echo "$ai_content" | jq -e 'type == "array"' > /dev/null 2>&1; then
                suggestions=$(echo "$ai_content")
              else
                # Handle cases where AI returns JSON wrapped in markdown
                suggestions=$(echo "$ai_content" | sed -n '/\[/,/\]/p' | jq '.' 2>/dev/null || echo "[]")
              fi
              
              # Validate and add suggestions
              valid_suggestions=$(echo "$suggestions" | jq '[.[] | select(.path and .line and .side and .body and (.line | type == "number"))]' 2>/dev/null || echo "[]")
              suggestion_count=$(echo "$valid_suggestions" | jq 'length')
              
              if [ "$suggestion_count" -gt 0 ]; then
                echo "✅ Generated $suggestion_count inline comments for $filename"
                
                # Merge with existing comments
                current_comments=$(cat inline_comments.json)
                echo "$current_comments" | jq --argjson new "$valid_suggestions" '. + $new' > inline_comments.json.tmp
                mv inline_comments.json.tmp inline_comments.json
                total_comments=$((total_comments + suggestion_count))
              fi
            else
              echo "⚠️ AI API call failed for $filename"
            fi
          done

      - name: Post inline review comments
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          comment_count=$(cat inline_comments.json | jq 'length')
          
          echo "📊 Generated $comment_count inline comments"

          if [ "$comment_count" -gt 0 ]; then
            echo "🚀 Posting inline review comments..."
            
            # Create review with inline comments using the correct GitHub API
            review_response=$(curl -s -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/reviews" \
              -d "{
                \"commit_id\": \"$COMMIT_SHA\",
                \"body\": \"🤖 **AI Code Review** - Found $comment_count areas for improvement\",
                \"event\": \"COMMENT\",
                \"comments\": $(cat inline_comments.json)
              }")
            
            http_code="${review_response: -3}"
            
            if [ "$http_code" = "200" ]; then
              echo "✅ Successfully posted $comment_count inline comments"
            else
              echo "❌ Failed to post review (HTTP $http_code)"
              echo "${review_response%???}"
              
              # Fallback: Post individual line comments
              echo "🔄 Attempting to post individual comments..."
              cat inline_comments.json | jq -c '.[]' | while read -r comment; do
                path=$(echo "$comment" | jq -r '.path')
                line=$(echo "$comment" | jq -r '.line')
                body=$(echo "$comment" | jq -r '.body')
                
                curl -s -X POST \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/comments" \
                  -d "{
                    \"commit_id\": \"$COMMIT_SHA\",
                    \"path\": \"$path\",
                    \"line\": $line,
                    \"side\": \"RIGHT\",
                    \"body\": \"$body\"
                  }" > /dev/null
              done
            fi
          else
            echo "ℹ️ No inline comments generated - code looks good!"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f pr_files.json inline_comments.json inline_comments.json.tmp
