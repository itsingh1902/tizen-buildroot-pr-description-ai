name: AI Inline Comment Diagnostic (one-shot)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (optional when running from a pull_request event)'
        required: false
      head_sha:
        description: 'Head commit SHA (optional)'
        required: false
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  post_single_inline_comment:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl
      - name: Compute and post a single inline comment (diagnostic)
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # these values are available when workflow triggered by pull_request
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          HEAD_SHA_FROM_EVENT: ${{ github.event.pull_request.head.sha }}
          # inputs when run via workflow_dispatch
          PR_FROM_INPUT: ${{ github.event.inputs.pr_number }}
          HEAD_SHA_FROM_INPUT: ${{ github.event.inputs.head_sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "Event: $GITHUB_EVENT_NAME"
          # Determine PR number and head SHA
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER="${PR_FROM_EVENT}"
            HEAD_SHA="${HEAD_SHA_FROM_EVENT}"
          else
            PR_NUMBER="${PR_FROM_INPUT:-}"
            HEAD_SHA="${HEAD_SHA_FROM_INPUT:-}"
          fi

          if [ -z "${PR_NUMBER:-}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "ERROR: PR number not provided. If you ran this manually, provide the 'pr_number' input."
            exit 1
          fi

          if [ -z "${HEAD_SHA:-}" ] || [ "${HEAD_SHA}" = "null" ]; then
            echo "WARN: head SHA not provided. Will attempt to read PR head sha from API."
            HEAD_SHA=""
          fi

          echo "Target repo: $GITHUB_REPO"
          echo "Target PR: $PR_NUMBER"
          if [ -n "$HEAD_SHA" ]; then
            echo "Using provided HEAD SHA: $HEAD_SHA"
          fi

          # Fetch PR files
          echo "Fetching files for PR #$PR_NUMBER..."
          curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPO}/pulls/${PR_NUMBER}/files" -o files.json

          if ! jq -e . files.json >/dev/null 2>&1; then
            echo "ERROR: files.json is not valid JSON; printing raw content:"
            cat files.json || true
            exit 1
          fi

          echo "Listing first 3 files (name + status):"
          jq -r '.[] | "\(.filename) (\.status)"' files.json | sed -n '1,3p' || true

          # pick the first file that has a patch
          file_obj=$(jq -c '.[] | select(.patch != null and .patch != "")' files.json | head -n1 || true)
          if [ -z "$file_obj" ]; then
            echo "No file with a patch found in this PR. Nothing to test."
            exit 0
          fi

          path=$(echo "$file_obj" | jq -r '.filename')
          patch=$(echo "$file_obj" | jq -r '.patch')

          echo "Selected file: $path"
          echo "Patch (first 40 lines):"
          printf "%s\n" "$patch" | sed -n '1,40p'
          echo "----"

          # Compute first added line's diff position and new file line number
          pos_and_new=$(printf "%s\n" "$patch" | awk '
            BEGIN {pos=0; new_line=0;}
            /^(\-\-\- |\+\+\+ )/ { next }
            /^@@/ {
              if (match($0, /\+([0-9]+)/, arr)) new_line = arr[1] - 1
              next
            }
            {
              if (length($0) == 0) next
              first = substr($0,1,1)
              if (first != " " && first != "+" && first != "-") next
              pos++
              if (first == "+") {
                new_line++
                print pos ":" new_line ":" substr($0,2)
                exit
              } else if (first == " ") {
                new_line++
              }
            }' )

          if [ -z "$pos_and_new" ]; then
            echo "No added '+' line found in the patch for $path. Exiting."
            exit 0
          fi

          pos=$(echo "$pos_and_new" | cut -d: -f1)
          new_line=$(echo "$pos_and_new" | cut -d: -f2)
          added_content=$(echo "$pos_and_new" | cut -d: -f3-)

          echo "Computed position: $pos"
          echo "Computed new_file line: $new_line"
          echo "Added content preview: $added_content"

          # If HEAD_SHA wasn't supplied, try to get it from the PR object
          if [ -z "${HEAD_SHA}" ] || [ "${HEAD_SHA}" = "null" ]; then
            echo "Retrieving head SHA from PR metadata..."
            HEAD_SHA=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPO}/pulls/${PR_NUMBER}" | jq -r '.head.sha // empty')
            if [ -z "$HEAD_SHA" ]; then
              echo "ERROR: could not determine head SHA for PR $PR_NUMBER"
              exit 1
            fi
            echo "Found head SHA: $HEAD_SHA"
          fi

          # Build payload to POST a single inline comment (position-based)
          comment_body="Test inline comment from workflow — position=${pos}, new_line=${new_line}
          
          This is a diagnostic test (delete me)."

                    payload=$(jq -n --arg commit_id "$HEAD_SHA" --arg path "$path" --arg position "$pos" --arg body "$comment_body" \
                      '{commit_id:$commit_id, path:$path, position:($position|tonumber), body:$body}')

                    echo "Posting a single inline comment to the PR (comments endpoint)..."
                    echo "Payload:"
                    echo "$payload"

                    response=$(curl -s -w "\nHTTPSTATUS:%{http_code}\n" -X POST \
                      -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      "https://api.github.com/repos/${GITHUB_REPO}/pulls/${PR_NUMBER}/comments" \
                      -d "$payload")

                    echo "API response:"
                    echo "$response"
                    echo "----"

                    # Print helpful hints
                    status=$(echo "$response" | tr -s '\n' ' ' | sed -n 's/.*HTTPSTATUS:\([0-9][0-9][0-9]\).*/\1/p')
                    if [ "$status" = "201" ]; then
                      echo "SUCCESS: comment created (HTTP 201). Check the Files changed tab in the PR."
                    else
                      echo "Comment create HTTP status: ${status} — if 422 or 200 but not visible, commit_id/position/path likely mismatched."
                      echo "If you see 422: position is out of range -> patch parsing or head SHA mismatch."
                      echo "If you see 403: permission problem with token (needs pull-requests: write & issues: write)."
                      echo "If you see 201 but nothing appears: check the Files changed UI and that the PR hasn't moved to a new commit after the position was computed."
                    fi
