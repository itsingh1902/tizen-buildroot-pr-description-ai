name: AI PR Description Generator

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ai-pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  generate_pr_description:
    runs-on: ubuntu-latest
    env:
      CISCO_CLIENT_ID: ${{ secrets.CISCO_CLIENT_ID }}
      CISCO_CLIENT_SECRET: ${{ secrets.CISCO_CLIENT_SECRET }}
      CISCO_APP_KEY: ${{ secrets.CISCO_APP_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BATCH_SIZE: 150
      CISCO_API_URL: "https://chat-ai.cisco.com/openai/deployments/gpt-4o-mini/chat/completions"

    steps:
      - name: Setup
        run: |
          set -euo pipefail
          
          # Install dependencies
          sudo apt-get update -y && sudo apt-get install -y jq curl git gh
          
          # Validate required secrets
          missing_vars=()
          [[ -z "${CISCO_CLIENT_ID:-}" ]] && missing_vars+=("CISCO_CLIENT_ID")
          [[ -z "${CISCO_CLIENT_SECRET:-}" ]] && missing_vars+=("CISCO_CLIENT_SECRET")
          [[ -z "${CISCO_APP_KEY:-}" ]] && missing_vars+=("CISCO_APP_KEY")
          [[ -z "${GITHUB_TOKEN:-}" ]] && missing_vars+=("GITHUB_TOKEN")
          
          if [[ ${#missing_vars[@]} -gt 0 ]]; then
            echo "❌ Missing required secrets: ${missing_vars[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Get Cisco API token
        run: |
          set -euo pipefail
          
          encoded_creds=$(echo -n "${CISCO_CLIENT_ID}:${CISCO_CLIENT_SECRET}" | base64 -w 0)
          
          token_response=$(curl -s --retry 3 --retry-delay 2 \
            -X POST 'https://id.cisco.com/oauth2/default/v1/token' \
            -H "Authorization: Basic ${encoded_creds}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d 'grant_type=client_credentials')
          
          access_token=$(echo "$token_response" | jq -r '.access_token // empty')
          
          if [[ -z "$access_token" || "$access_token" == "null" ]]; then
            echo "❌ Failed to obtain access token: $token_response"
            exit 1
          fi
          
          echo "CISCO_ACCESS_TOKEN=${access_token}" >> "$GITHUB_ENV"

      - name: Analyze changes and generate AI content
        id: ai_generation
        run: |
          set -euo pipefail
            if summary=$(call_cisco_ai \
              "You summarize git diffs for PR descriptions. Focus on what changed and why it matters." \
              "$(cat "$batch")"); then
              if [[ -n "$summary" ]]; then
                {
                  echo "## Batch $(basename "$batch")"
                  echo "$summary"
                  echo ""
                } >> batch_summaries.txt
              fi
            fi
          done
          
          # Generate PR description
          pr_desc="AI-generated PR description failed. Please review changes manually."
          if summary_content=$(cat batch_summaries.txt 2>/dev/null); then
            if result=$(call_cisco_ai \
              "You are a professional release engineer. Create a concise,
               structured PR description with: 1) Summary (1-2 lines), 2) Changed areas/files, 3) Impact/risk level with justification, 4) Testing notes, 5) Suggested reviewers. Keep it production-ready." \
              "$summary_content"); then
              pr_desc="$result"
            fi
          fi
          
          # Generate test scenarios
          test_scenarios="AI-generated test scenarios failed. Please create test cases manually."
          if diff_content=$(cat diff.txt 2>/dev/null); then
            if result=$(call_cisco_ai \
              "You are a test architect. Create prioritized test cases from the git diff,
               including boundary and negative cases. Focus on practical testing approaches." \
              "$diff_content"); then
              test_scenarios="$result"
            fi
          fi
          
          # Store in environment
          {
            echo 'PR_DESCRIPTION<<EOF'
            echo "$pr_desc"
            echo 'EOF'
            echo 'AI_TEST_SCENARIOS<<EOF'
            echo "$test_scenarios"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Update PR and add test comment
        if: steps.ai_generation.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          
          # Update PR description
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            -X PATCH -F body="$PR_DESCRIPTION"
          
          # Prepare test scenarios comment
          comment_body="### 🧪 AI Test Scenarios
          
          $AI_TEST_SCENARIOS
          
          *This comment was generated automatically by AI to help with testing validation.*"
          
          # Find existing test scenarios comment
          existing_comment=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.user.login=="github-actions[bot]" and (.body | startswith("### 🧪 AI Test Scenarios"))) | .id' 2>/dev/null || true)
          
          # Update or create comment
          if [[ -n "$existing_comment" ]]; then
            gh api "repos/${{ github.repository }}/issues/comments/$existing_comment" -X PATCH -F body="$comment_body"
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body="$comment_body"
          fi

      - name: Link to Jira ticket
        if: steps.ai_generation.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          JIRA_BASE_URL: https://cisco-sbg.atlassian.net
          JIRA_TOKEN: ${{ secrets.JIRA_PERSONAL_TOKEN }}
          JIRA_EMAIL: itsingh@cisco.com
        run: |
          set +e  # Allow failures for optional Jira integration
          
          # Extract Jira key from PR title or branch
          jira_key=$(echo -e "${{ github.event.pull_request.title }}\n${{ github.head_ref }}" | \
                     grep -oE '[A-Z]{2,10}-[0-9]+' | head -1 || true)
          
          if [[ -z "$jira_key" ]]; then
            echo "No Jira key found - skipping Jira integration"
            exit 0
          fi
          
          if [[ -z "${JIRA_TOKEN:-}" ]]; then
            echo "JIRA_TOKEN not configured - skipping Jira integration"
            exit 0
          fi
          
          echo "Linking to Jira issue: $jira_key"
          
          # Create simple comment with PR link
          comment_data=$(jq -n --arg body "PR: ${{ github.event.pull_request.html_url }}" '{body: $body}')
          
          # Post to Jira (using v2 API for simplicity)
          if curl -s -X POST \
            -u "$JIRA_EMAIL:$JIRA_TOKEN" \
            -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/2/issue/$jira_key/comment" \
            -d "$comment_data" >/dev/null 2>&1; then
            echo "✅ Linked to Jira: $jira_key"
          else
            echo "⚠️ Jira link failed"
          fi

      - name: Cleanup and summary
        if: always()
        run: |
          set +e  # Allow cleanup to continue even if files don't exist
          
          # Cleanup temporary files
          rm -f diff.txt diff_batch_* batch_summaries.txt >/dev/null 2>&1 || true
          
          # Show summary if changes were processed
          if [[ "${{ steps.ai_generation.outputs.has_changes }}" == "true" ]]; then
            echo "🎉 AI PR Description Generator Complete!"
            echo "✅ PR description updated with AI analysis"
            echo "✅ Test scenarios posted as comment"
            echo "✅ Jira integration attempted (if configured)"
          else
            echo "ℹ️ No meaningful changes detected - skipped AI generation"
          fi