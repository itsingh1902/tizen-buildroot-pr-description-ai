name: AI Batching PR Description (OpenAI - Modular)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate_pr_description:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BATCH_SIZE: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Validate environment variables
        run: |
          test -n "$OPENAI_API_KEY" || { echo "❌ OPENAI_API_KEY not set"; exit 1; }

      - name: Extract git diff
        run: git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > diff.txt

      - name: Detect changes
        id: detect_changes
        run: |
          if [ -s diff.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Split diff into batches
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          split -l $BATCH_SIZE diff.txt diff_batch_
          echo "BATCH_COUNT=$(ls diff_batch_* | wc -l)" >> $GITHUB_ENV

      - name: Summarize batches via OpenAI
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          rm -f batch_summaries.txt
          for batch in diff_batch_*; do
            summary=$(curl -s https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d @- <<EOF
{
  "model":"gpt-4o-mini",
  "messages":[
    {"role":"system","content":"You summarize git diffs for PR descriptions."},
    {"role":"user","content":$(jq -Rs . <"$batch")}
  ],
  "max_tokens":300,
  "temperature":0.2
}
EOF
            )
            echo "## $(basename $batch)" >> batch_summaries.txt
            echo "$summary" | jq -r '.choices[0].message.content' >> batch_summaries.txt
            echo >> batch_summaries.txt
          done

      - name: Aggregate and rephrase summary
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          full=$(jq -Rs . < batch_summaries.txt)
          pr_desc=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
{
  "model":"gpt-4o-mini",
  "messages":[
    {"role":"system","content":"You create concise, professional PR descriptions."},
    {"role":"user","content":$full}
  ],
  "max_tokens":400,
  "temperature":0.3
}
EOF
          )
          echo "PR_DESCRIPTION<<EOF" >> $GITHUB_ENV
          echo "$pr_desc" | jq -r '.choices[0].message.content' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate AI review & test scenarios
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          diff=$(jq -Rs . < diff.txt)
          code_review=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
{
  "model":"gpt-4o-mini",
  "messages":[
    {"role":"system","content":"You are a strict senior code reviewer. Provide detailed review comments."},
    {"role":"user","content":$diff}
  ],
  "max_tokens":500,
  "temperature":0.2
}
EOF
          )
          test_scenarios=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
{
  "model":"gpt-4o-mini",
  "messages":[
    {"role":"system","content":"You are a test architect. Provide test case scenarios."},
    {"role":"user","content":$diff}
  ],
  "max_tokens":500,
  "temperature":0.2
}
EOF
          )
          echo "AI_CODE_REVIEW<<EOF" >> $GITHUB_ENV
          echo "$code_review" | jq -r '.choices[0].message.content' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "AI_TEST_SCENARIOS<<EOF" >> $GITHUB_ENV
          echo "$test_scenarios" | jq -r '.choices[0].message.content' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate inline comments per file
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          echo "[]" > comments.json
          gh pr diff --unified=0 --json files -q '.files[] | {path, patch}' | \
          jq -rc '.[] | select(.patch != null) | [.path, .patch] | @base64' | \
          while read entry; do
            decoded=$(echo "$entry" | base64 -d | jq -r '.')
            path=$(jq -r '.[0]' <<<"$decoded")
            patch=$(jq -r '.[1]' <<<"$decoded")
            suggestions=$(curl -s https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d @- <<EOF
{
  "model":"gpt-4o-mini",
  "messages":[
    {"role":"system","content":"You are a code reviewer. For the provided diff patch, return a JSON array of inline comments with keys path, line (on RIGHT side), side:'RIGHT', and body."},
    {"role":"user","content":$(jq -Rs . <<<"$patch")}
  ],
  "max_tokens":300,
  "temperature":0.2
}
EOF
            )
            if jq -e . >/dev/null <<<"$suggestions"; then
              jq --argjson new "$suggestions" '. + $new' comments.json > tmp.json
              mv tmp.json comments.json
            fi
          done

      - name: Post inline comments as PR review
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          comments=$(cat comments.json)
          if [ "$(jq length <<<"$comments")" -gt 0 ]; then
            gh pr review ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body "🤖 **AI Code Review Inline Comments**" \
              --comments "$comments"
          else
            echo "No inline comments to post."
          fi

      - name: Update PR description
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$PR_DESCRIPTION"

      - name: Post AI review summary comment
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body $'### 🤖 AI Code Review\n'"$AI_CODE_REVIEW"$'\n---\n### 🧪 AI Test Scenarios\n'"$AI_TEST_SCENARIOS"
