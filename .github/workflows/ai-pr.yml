name: AI Batching PR Description (OpenAI - Modular)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate_pr_description:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPO: ${{ github.repository }}
      BATCH_SIZE: 150

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Checkout repo on PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Validate environment variables
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not set" && exit 1
          fi

      - name: Extract git diff
        run: git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > diff.txt

      - name: Check for changes
        id: change_detection
        run: |
          if [ -s diff.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Summarize diff batches
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          rm -f batch_summaries.txt
          split -l $BATCH_SIZE diff.txt diff_batch_
          for b in diff_batch_*; do
            content=$(<"$b")
            # Escape content for JSON
            escaped_content=$(echo "$content" | jq -Rs .)
            response=$(curl -s https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a helpful assistant that summarizes git diffs.\"},{\"role\":\"user\",\"content\":$escaped_content}],\"max_tokens\":300}")
            
            # Check if API call was successful
            if echo "$response" | jq -e .choices > /dev/null 2>&1; then
              summary=$(echo "$response" | jq -r '.choices[0].message.content')
              echo "## $b" >> batch_summaries.txt
              echo "$summary" >> batch_summaries.txt
              echo >> batch_summaries.txt
            else
              echo "## $b (API Error)" >> batch_summaries.txt
              echo "Failed to generate summary for this batch." >> batch_summaries.txt
              echo >> batch_summaries.txt
            fi
          done

      - name: Aggregate PR description
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          summaries_content=$(<batch_summaries.txt)
          escaped_summaries=$(echo "$summaries_content" | jq -Rs .)
          response=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a helpful assistant that drafts PR descriptions.\"},{\"role\":\"user\",\"content\":\"Combine these summaries:\\n$summaries_content\"}],\"max_tokens\":400}")

          if echo "$response" | jq -e .choices > /dev/null 2>&1; then
            desc=$(echo "$response" | jq -r '.choices[0].message.content')
          else
            desc="Failed to generate PR description."
          fi

          echo "PR_DESCRIPTION<<EOF" >> $GITHUB_ENV
          echo "$desc" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Generate AI Code Review and AI Test Scenarios
      - name: Generate AI Code Review
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          diff_content=$(<diff.txt)
          escaped_diff=$(echo "$diff_content" | jq -Rs .)
          response=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a senior code reviewer. Provide detailed review comments in markdown.\"},{\"role\":\"user\",\"content\":\"Review this diff:\\n$diff_content\"}],\"max_tokens\":500}")

          if echo "$response" | jq -e .choices > /dev/null 2>&1; then
            review=$(echo "$response" | jq -r '.choices[0].message.content')
          else
            review="Failed to generate code review."
          fi

          echo "REVIEW_CONTENT<<EOF" >> $GITHUB_ENV
          echo "$review" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate AI Test Scenarios
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          diff_content=$(<diff.txt)
          escaped_diff=$(echo "$diff_content" | jq -Rs .)
          response=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a test architect. Generate test case scenarios in markdown.\"},{\"role\":\"user\",\"content\":\"Generate tests for this diff:\\n$diff_content\"}],\"max_tokens\":500}")

          if echo "$response" | jq -e .choices > /dev/null 2>&1; then
            tests=$(echo "$response" | jq -r '.choices[0].message.content')
          else
            tests="Failed to generate test scenarios."
          fi

          echo "TEST_CONTENT<<EOF" >> $GITHUB_ENV
          echo "$tests" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Create gists
      - name: Create Gists for AI outputs
        if: steps.change_detection.outputs.has_changes == 'true'
        id: gists
        run: |
          create_gist() {
            local desc=$1; local file=$2; local content=$3; 
            escaped_content=$(echo "$content" | jq -Rs .)
            echo "{\"description\":\"$desc\",\"public\":false,\"files\":{\"$file\":{\"content\":$escaped_content}}}" > payload.json
            response=$(curl -s -X POST https://api.github.com/gists \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d @payload.json)
            if echo "$response" | jq -e .html_url > /dev/null 2>&1; then
              echo "$response" | jq -r .html_url
            else
              echo "https://github.com/gist"  # fallback URL
            fi
          }
          REVIEW_URL=$(create_gist "AI Code Review for PR #${GITHUB_PR_NUMBER}" "AI_PR_Code_Review.md" "$REVIEW_CONTENT")
          TEST_URL=$(create_gist "AI Test Scenarios for PR #${GITHUB_PR_NUMBER}" "AI_Test_Case_Scenarios.md" "$TEST_CONTENT")
          echo "REVIEW_URL=$REVIEW_URL" >> $GITHUB_OUTPUT
          echo "TEST_URL=$TEST_URL" >> $GITHUB_OUTPUT

      # Clean existing AI sections from PR body
      - name: Clean existing AI sections
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          current=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER \
            | jq -r '.body // ""')
          cleaned=$(echo "$current" | sed '/^## 🤖 AI-Generated PR Description$/,$d')
          echo "CLEAN_BODY<<EOF" >> $GITHUB_ENV
          echo "$cleaned" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Update PR body with new description and gist links
      - name: Update PR body
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          ai_section="## 🤖 AI-Generated PR Description

          ${PR_DESCRIPTION}

          **AI Code Review:** [View here](${{ steps.gists.outputs.REVIEW_URL }})

          **Test Case Scenarios:** [View here](${{ steps.gists.outputs.TEST_URL }})"

          if [ -n "$CLEAN_BODY" ]; then
            new_body="$ai_section

          $CLEAN_BODY"
          else
            new_body="$ai_section"
          fi

          payload=$(jq -Rn --arg b "$new_body" '{body:$b}')
          curl -s -X PATCH https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Cleanup
        if: always() && steps.change_detection.outputs.has_changes == 'true'
        run: rm -f diff.txt batch_summaries.txt diff_batch_* payload.json
