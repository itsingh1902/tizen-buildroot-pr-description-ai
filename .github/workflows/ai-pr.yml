name: AI Batching PR Description (OpenAI - Modular)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate_pr_description:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPO: ${{ github.repository }}
      BATCH_SIZE: 150

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Checkout repository and set PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Validate environment variables
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY is not set"; exit 1
          fi

      - name: Extract git diff
        run: |
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > diff.txt

      - name: Fetch GitHub API diff
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/files" \
            > files_diff.json

      - name: Combine both diffs into JSON
        run: |
          jq -n --arg gitdiff "$(cat diff.txt)" --argjson apidiff "$(cat files_diff.json)" \
            '{gitdiff: $gitdiff, apidiff: $apidiff}' > combined_diff.json

      - name: Check for meaningful changes
        id: change_detection
        run: |
          if [ -s diff.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Split diff into batches
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          split -l $BATCH_SIZE diff.txt diff_batch_
          echo "BATCH_COUNT=$(ls diff_batch_* | wc -l)" >> $GITHUB_ENV

      - name: Test OpenAI API connectivity
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          curl -s https://api.openai.com/v1/models \
            -H "Authorization: Bearer $OPENAI_API_KEY" | jq '.data | length'

      - name: Initialize batch processing
        if: steps.change_detection.outputs.has_changes == 'true'
        run: echo "PROCESSED_BATCHES=0" >> $GITHUB_ENV

      - name: Process each batch with OpenAI
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          rm -f batch_summaries.txt
          processed=0
          for batch in diff_batch_*; do
            diff_content=$(cat "$batch")
            escaped_content=$(echo "$diff_content" | jq -Rs .)
            response=$(curl -s "https://api.openai.com/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You summarize git diffs for PR descriptions.\"},{\"role\":\"user\",\"content\":$escaped_content}],\"max_tokens\":300,\"temperature\":0.2}")
            if echo "$response" | jq -e .choices > /dev/null 2>&1; then
              summary=$(echo "$response" | jq -r '.choices[0].message.content // ""')
              if [ -n "$summary" ]; then
                echo "## Batch $(basename "$batch")" >> batch_summaries.txt
                echo "$summary" >> batch_summaries.txt; echo "" >> batch_summaries.txt
                processed=$((processed+1))
              fi
            fi
          done
          echo "PROCESSED_BATCHES=$processed" >> $GITHUB_ENV

      - name: Aggregate and rephrase summaries
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          full_summary=$(cat batch_summaries.txt)
          escaped_summary=$(echo "$full_summary" | jq -Rs .)
          response=$(curl -s "https://api.openai.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You create concise, professional PR descriptions.\"},{\"role\":\"user\",\"content\":$escaped_summary}],\"max_tokens\":400,\"temperature\":0.3}")

          if echo "$response" | jq -e .choices > /dev/null 2>&1; then
            pr_desc=$(echo "$response" | jq -r '.choices[0].message.content // ""')
          else
            pr_desc="Failed to generate PR description."
          fi

          echo "PR_DESCRIPTION<<EOF" >> $GITHUB_ENV
          echo "$pr_desc" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate AI Code Review and Test Scenarios
        if: steps.change_detection.outputs.has_changes == 'true'
        id: ai_reviews
        run: |
          diff=$(cat diff.txt)
          escaped_diff=$(echo "$diff" | jq -Rs .)
          review=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a strict senior code reviewer. Provide detailed review comments.\"},{\"role\":\"user\",\"content\":$escaped_diff}],\"max_tokens\":500,\"temperature\":0.2}")
          tests=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a test architect. Provide test case scenarios.\"},{\"role\":\"user\",\"content\":$escaped_diff}],\"max_tokens\":500,\"temperature\":0.2}")
          review_text=$(echo "$review" | jq -r '.choices[0].message.content // ""')
          test_text=$(echo "$tests" | jq -r '.choices[0].message.content // ""')
          echo "AI_CODE_REVIEW<<EOF" >> $GITHUB_ENV
          echo "$review_text" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "AI_TEST_SCENARIOS<<EOF" >> $GITHUB_ENV
          echo "$test_text" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # ---- INLINE COMMENTS SECTION ----
      - name: Generate AI Inline Comments with Modern API Parameters
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          echo "[]" > inline_comments.json
          echo "$(cat files_diff.json)" | jq -r '.[] | select(.patch != null) | @base64' | while read -r file; do
            file_data=$(echo "$file" | base64 -d)
            filename=$(echo "$file_data" | jq -r '.filename')
            patch=$(echo "$file_data" | jq -r '.patch // ""')
            if [ -n "$patch" ] && [ "$patch" != "null" ]; then
              escaped_patch=$(echo "$patch" | jq -Rs .)
              ai_response=$(curl -s https://api.openai.com/v1/chat/completions \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{
                  \"model\":\"gpt-4o-mini\",
                  \"messages\":[
                    {\"role\":\"system\",\"content\":\"You are a code reviewer. Analyze the patch and identify specific issues. For each issue, return a JSON object with keys: path (file name), line (line number in NEW file), side ('RIGHT'), body (suggestion). Only comment on new/modified code (+ lines in patch). Return ONLY a JSON array.\"},
                    {\"role\":\"user\",\"content\":$escaped_patch}
                  ],
                  \"max_tokens\":500,
                  \"temperature\":0.2
                }")
              suggestions=$(echo "$ai_response" | jq -r '.choices[0].message.content // "[]"')
              if echo "$suggestions" | jq empty 2>/dev/null; then
                current_comments=$(cat inline_comments.json)
                echo "$current_comments" | jq --argjson new "$suggestions" '. + $new' > inline_comments.json.tmp
                mv inline_comments.json.tmp inline_comments.json
              fi
            fi
          done

      - name: Create PR Review with Inline Comments
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          if [ ! -f "inline_comments.json" ]; then
            echo "[]" > inline_comments.json
          fi
          comment_count=$(cat inline_comments.json | jq 'length')
          echo "Found $comment_count inline comments to create"
          if [ "$comment_count" -gt 0 ]; then
            cat inline_comments.json | jq '.[] | select(.path and .line and .side and .body)' > validated_comments.json
            validated_count=$(cat validated_comments.json | jq -s 'length')
            echo "Validated $validated_count comments"
            if [ "$validated_count" -gt 0 ]; then
              review_body="🤖 **AI Code Review**\n\nI've analyzed your changes and provided $(cat validated_comments.json | jq -s 'length') specific inline suggestions below."
              response=$(curl -s -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/reviews" \
                -d "{
                  \"commit_id\":\"$COMMIT_SHA\",
                  \"body\":\"$review_body\",
                  \"event\":\"COMMENT\",
                  \"comments\":$(cat validated_comments.json | jq -s '.')
                }")
              if echo "$response" | jq -e '.id' > /dev/null 2>&1; then
                review_id=$(echo "$response" | jq -r '.id')
                echo "✅ Created PR review with ID: $review_id and $(cat validated_comments.json | jq -s 'length') inline comments"
              else
                echo "❌ Failed to create PR review"
                echo "Response: $response" | jq '.'
                echo "Attempting to create individual comments as fallback..."
                cat validated_comments.json | jq -c '.[]' | while read -r comment; do
                  curl -s -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $GITHUB_TOKEN" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/comments" \
                    -d "$comment"
                done
              fi
            else
              echo "ℹ️ No valid inline comments to create"
            fi
          else
            echo "ℹ️ No inline comments generated"
          fi

      - name: Post or update AI review comment
        if: steps.change_detection.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY="### 🤖 AI Code Review\n\n$AI_CODE_REVIEW\n\n---\n\n### 🧪 AI Test Case Scenarios\n\n$AI_TEST_SCENARIOS"
          comment_id=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -q ".[] | select(.user.login==\"github-actions[bot]\") | select(.body|startswith(\"### 🤖 AI Code Review\")) | .id")
          if [ -n "$comment_id" ]; then
            gh api repos/${{ github.repository }}/issues/comments/$comment_id \
              -X PATCH -F body="$COMMENT_BODY"
          else
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              -F body="$COMMENT_BODY"

      - name: Update PR body
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          current=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} -q .body)
          cleaned=$(echo "$current" | sed '/^## 🤖 AI/d')
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} \
            -X PATCH \
            -F body="$PR_DESCRIPTION"

      - name: Cleanup temporary files
        if: always() && steps.change_detection.outputs.has_changes == 'true'
        run: rm -f diff.txt files_diff.json combined_diff.json diff_batch_* batch_summaries.txt inline_comments.json inline_comments.json.tmp validated_comments.json
