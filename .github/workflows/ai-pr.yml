name: AI Batching PR Description (OpenAI - Modular)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate_pr_description:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPO: ${{ github.repository }}
      BATCH_SIZE: 150

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Checkout repository and set PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Validate environment variables
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY is not set"; exit 1
          fi

      - name: Extract git diff
        run: |
          git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > diff.txt

      - name: Fetch GitHub API diff
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/files" \
            > files_diff.json

      - name: Combine both diffs into JSON
        run: |
          jq -n --arg gitdiff "$(cat diff.txt)" --argjson apidiff "$(cat files_diff.json)" \
            '{gitdiff: $gitdiff, apidiff: $apidiff}' > combined_diff.json

      - name: Check for meaningful changes
        id: change_detection
        run: |
          if [ -s diff.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Split diff into batches
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          split -l $BATCH_SIZE diff.txt diff_batch_
          echo "BATCH_COUNT=$(ls diff_batch_* | wc -l)" >> $GITHUB_ENV

      - name: Test OpenAI API connectivity
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          curl -s https://api.openai.com/v1/models \
            -H "Authorization: Bearer $OPENAI_API_KEY" | jq '.data | length'

      - name: Process each batch with OpenAI
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          rm -f batch_summaries.txt
          for batch in diff_batch_*; do
            diff_content=$(cat "$batch")
            escaped_content=$(echo "$diff_content" | jq -Rs .)
            response=$(curl -s "https://api.openai.com/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You summarize git diffs for PR descriptions.\"},{\"role\":\"user\",\"content\":$escaped_content}],\"max_tokens\":300,\"temperature\":0.2}")
            
            if echo "$response" | jq -e .choices > /dev/null 2>&1; then
              summary=$(echo "$response" | jq -r '.choices[0].message.content // ""')
              if [ -n "$summary" ]; then
                echo "## Batch $(basename "$batch")" >> batch_summaries.txt
                echo "$summary" >> batch_summaries.txt; echo "" >> batch_summaries.txt
              fi
            fi
          done

      - name: Aggregate and rephrase summaries
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          full_summary=$(cat batch_summaries.txt)
          escaped_summary=$(echo "$full_summary" | jq -Rs .)
          response=$(curl -s "https://api.openai.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You create concise, professional PR descriptions.\"},{\"role\":\"user\",\"content\":$escaped_summary}],\"max_tokens\":400,\"temperature\":0.3}")

          if echo "$response" | jq -e .choices > /dev/null 2>&1; then
            pr_desc=$(echo "$response" | jq -r '.choices[0].message.content // ""')
          else
            pr_desc="Failed to generate PR description."
          fi

          echo "PR_DESCRIPTION<<EOF" >> $GITHUB_ENV
          echo "$pr_desc" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate AI Code Review and Test Scenarios
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          diff=$(cat diff.txt)
          escaped_diff=$(echo "$diff" | jq -Rs .)

          review=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a strict senior code reviewer. Provide detailed review comments.\"},{\"role\":\"user\",\"content\":$escaped_diff}],\"max_tokens\":500,\"temperature\":0.2}")

          tests=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
            -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a test architect. Provide test case scenarios.\"},{\"role\":\"user\",\"content\":$escaped_diff}],\"max_tokens\":500,\"temperature\":0.2}")

          review_text=$(echo "$review" | jq -r '.choices[0].message.content // ""')
          test_text=$(echo "$tests" | jq -r '.choices[0].message.content // ""')
          echo "AI_CODE_REVIEW<<EOF" >> $GITHUB_ENV
          echo "$review_text" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "AI_TEST_SCENARIOS<<EOF" >> $GITHUB_ENV
          echo "$test_text" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate AI Inline Comments
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          echo "[]" > inline_comments.json
          
          # Process each file with changes
          cat files_diff.json | jq -c '.[] | select(.patch != null and .additions > 0)' | while IFS= read -r file_json; do
            filename=$(echo "$file_json" | jq -r '.filename')
            patch=$(echo "$file_json" | jq -r '.patch')
            
            echo "Processing file: $filename"
            
            # Parse patch to find added lines with correct line numbers
            current_line=0
            in_hunk=false
            
            echo "$patch" | while IFS= read -r line; do
              case "$line" in
                "@@"*)
                  # Extract starting line number for new file (right side)
                  new_start=$(echo "$line" | sed -n 's/.*+\([0-9]*\).*/\1/p')
                  if [ -n "$new_start" ]; then
                    current_line=$((new_start - 1))
                    in_hunk=true
                  fi
                  ;;
                "+"*)
                  if [ "$in_hunk" = true ] && [ "$line" != "+++"* ]; then
                    current_line=$((current_line + 1))
                    code_line=$(echo "$line" | sed 's/^+//')
                    
                    # Skip empty lines or very short lines
                    if [ ${#code_line} -gt 5 ]; then
                      escaped_code=$(echo "$code_line" | jq -Rs .)
                      escaped_filename=$(echo "$filename" | jq -Rs .)
                      
                      ai_response=$(curl -s https://api.openai.com/v1/chat/completions \
                        -H "Authorization: Bearer $OPENAI_API_KEY" \
                        -H "Content-Type: application/json" \
                        -d "{
                          \"model\":\"gpt-4o-mini\",
                          \"messages\":[
                            {\"role\":\"system\",\"content\":\"You are a code reviewer. Analyze this specific line of code and provide a concise suggestion if you see room for improvement. Focus on: bugs, performance, security, or best practices. If the line looks good, respond with 'SKIP'. Keep response under 80 characters.\"},
                            {\"role\":\"user\",\"content\":\"File: $escaped_filename\\nLine $current_line: $escaped_code\"}
                          ],
                          \"max_tokens\":80,
                          \"temperature\":0.1
                        }")
                      
                      suggestion=$(echo "$ai_response" | jq -r '.choices[0].message.content // ""')
                      
                      if [ -n "$suggestion" ] && [ "$suggestion" != "SKIP" ] && [ "$suggestion" != "null" ]; then
                        # Create inline comment
                        comment_json=$(jq -n \
                          --arg path "$filename" \
                          --argjson line "$current_line" \
                          --arg body "🤖 **AI Suggestion:** $suggestion" \
                          '{
                            path: $path,
                            line: $line,
                            side: "RIGHT",
                            body: $body
                          }')
                        
                        # Add to comments array (use file lock to prevent race conditions)
                        (
                          flock -x 200
                          current=$(cat inline_comments.json)
                          echo "$current" | jq --argjson new "[$comment_json]" '. + $new' > inline_comments.json.tmp
                          mv inline_comments.json.tmp inline_comments.json
                        ) 200>inline_comments.lock
                        
                        echo "Added comment for $filename:$current_line"
                        
                        # Limit to 2 comments per file to avoid spam
                        comment_count=$(cat inline_comments.json | jq --arg path "$filename" '[.[] | select(.path == $path)] | length')
                        if [ "$comment_count" -ge 2 ]; then
                          break
                        fi
                      fi
                    fi
                  fi
                  ;;
                " "*)
                  # Context line in new file
                  if [ "$in_hunk" = true ]; then
                    current_line=$((current_line + 1))
                  fi
                  ;;
                "-"*)
                  # Deleted line - don't increment current_line
                  ;;
              esac
            done
          done
          
          # Log final results
          total_comments=$(cat inline_comments.json | jq 'length')
          echo "Generated $total_comments inline comments total"
          
          # Debug: show generated comments
          if [ "$total_comments" -gt 0 ]; then
            echo "Generated comments:"
            cat inline_comments.json | jq '.[] | "\(.path):\(.line) - \(.body)"'
          fi

      - name: Create PR Review with Inline Comments
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          comment_count=$(cat inline_comments.json | jq 'length')
          
          echo "Attempting to create review with $comment_count inline comments for commit $COMMIT_SHA"
          
          if [ "$comment_count" -gt 0 ]; then
            # Show what we're about to send
            echo "Comments to be posted:"
            cat inline_comments.json | jq '.'
            
            # Create review payload
            review_payload=$(jq -n \
              --arg commit_id "$COMMIT_SHA" \
              --arg body "🤖 **AI Code Review** - I've analyzed your changes and provided $comment_count inline suggestions in the Files Changed tab." \
              --arg event "COMMENT" \
              --argjson comments "$(cat inline_comments.json)" \
              '{
                commit_id: $commit_id,
                body: $body,
                event: $event,
                comments: $comments
              }')
            
            # Debug: show the payload
            echo "Review payload:"
            echo "$review_payload" | jq '.'
            
            # Submit the review
            response=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/reviews" \
              -d "$review_payload")
            
            # Parse response
            http_code=$(echo "$response" | tail -n1)
            response_body=$(echo "$response" | sed '$d')
            
            echo "HTTP Status Code: $http_code"
            echo "Response Body: $response_body"
            
            if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
              echo "✅ Successfully created PR review with $comment_count inline comments"
            else
              echo "❌ Failed to create PR review. Trying individual comments as fallback..."
              
              # Fallback: try creating individual line comments
              cat inline_comments.json | jq -c '.[]' | while IFS= read -r comment; do
                individual_payload=$(echo "$comment" | jq --arg commit_id "$COMMIT_SHA" '. + {commit_id: $commit_id}')
                
                echo "Creating individual comment: $individual_payload"
                curl -s -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$GITHUB_REPO/pulls/$GITHUB_PR_NUMBER/comments" \
                  -d "$individual_payload"
              done
            fi
          else
            echo "ℹ️ No inline comments generated - AI found no issues to comment on"
          fi

      - name: Post or update AI review comment
        if: steps.change_detection.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY="### 🤖 AI Code Review

          $AI_CODE_REVIEW

          ---

          ### 🧪 AI Test Case Scenarios

          $AI_TEST_SCENARIOS"

          comment_id=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -q ".[] | select(.user.login==\"github-actions[bot]\") | select(.body|startswith(\"### 🤖 AI Code Review\")) | .id")
          if [ -n "$comment_id" ]; then
            gh api repos/${{ github.repository }}/issues/comments/$comment_id \
              -X PATCH -F body="$COMMENT_BODY"
          else
            gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              -F body="$COMMENT_BODY"
          fi

      - name: Update PR body
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} \
            -X PATCH -F body="$PR_DESCRIPTION"

      - name: Cleanup temporary files
        if: always() && steps.change_detection.outputs.has_changes == 'true'
        run: rm -f diff.txt files_diff.json combined_diff.json diff_batch_* batch_summaries.txt inline_comments.json inline_comments.lock