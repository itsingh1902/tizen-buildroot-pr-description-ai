name: AI Batching PR Description (OpenAI - Modular)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate_pr_description:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BATCH_SIZE: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Validate environment variables
        run: |
          test -n "$OPENAI_API_KEY" || { echo "❌ OPENAI_API_KEY not set"; exit 1; }

      - name: Extract git diff
        run: git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > diff.txt

      - name: Detect changes
        id: detect_changes
        run: |
          if [ -s diff.txt ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Split diff into batches
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          split -l $BATCH_SIZE diff.txt diff_batch_
          echo "BATCH_COUNT=$(ls diff_batch_* | wc -l)" >> $GITHUB_ENV

      - name: Summarize batches via OpenAI
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          rm -f batch_summaries.txt
          for batch in diff_batch_*; do
            content=$(jq -Rs . <"$batch")
            summary=$(curl -s https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"model\":\"gpt-4o-mini\",
                \"messages\":[
                  {\"role\":\"system\",\"content\":\"You summarize git diffs for PR descriptions.\"},
                  {\"role\":\"user\",\"content\":$content}
                ],
                \"max_tokens\":300,
                \"temperature\":0.2
              }")
            
            if echo "$summary" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
              echo "## $(basename $batch)" >> batch_summaries.txt
              echo "$summary" | jq -r '.choices[0].message.content' >> batch_summaries.txt
              echo >> batch_summaries.txt
            else
              echo "## $(basename $batch)" >> batch_summaries.txt
              echo "Error summarizing this batch" >> batch_summaries.txt
              echo >> batch_summaries.txt
            fi
          done

      - name: Aggregate and rephrase summary
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          full=$(jq -Rs . < batch_summaries.txt)
          pr_desc=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\":\"gpt-4o-mini\",
              \"messages\":[
                {\"role\":\"system\",\"content\":\"You create concise, professional PR descriptions.\"},
                {\"role\":\"user\",\"content\":$full}
              ],
              \"max_tokens\":400,
              \"temperature\":0.3
            }")

          if echo "$pr_desc" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
            {
              echo "PR_DESCRIPTION<<EOF"
              echo "$pr_desc" | jq -r '.choices[0].message.content'
              echo "EOF"
            } >> $GITHUB_ENV
          else
            {
              echo "PR_DESCRIPTION<<EOF"
              echo "AI-generated description failed to generate"
              echo "EOF"
            } >> $GITHUB_ENV
          fi

      - name: Generate AI review & test scenarios
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          diff=$(jq -Rs . < diff.txt)
          code_review=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\":\"gpt-4o-mini\",
              \"messages\":[
                {\"role\":\"system\",\"content\":\"You are a strict senior code reviewer. Provide detailed review comments.\"},
                {\"role\":\"user\",\"content\":$diff}
              ],
              \"max_tokens\":500,
              \"temperature\":0.2
            }")

          test_scenarios=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\":\"gpt-4o-mini\",
              \"messages\":[
                {\"role\":\"system\",\"content\":\"You are a test architect. Provide test case scenarios.\"},
                {\"role\":\"user\",\"content\":$diff}
              ],
              \"max_tokens\":500,
              \"temperature\":0.2
            }")

          if echo "$code_review" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
            {
              echo "AI_CODE_REVIEW<<EOF"
              echo "$code_review" | jq -r '.choices[0].message.content'
              echo "EOF"
            } >> $GITHUB_ENV
          else
            {
              echo "AI_CODE_REVIEW<<EOF"
              echo "AI code review failed to generate"
              echo "EOF"
            } >> $GITHUB_ENV
          fi

          if echo "$test_scenarios" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
            {
              echo "AI_TEST_SCENARIOS<<EOF"
              echo "$test_scenarios" | jq -r '.choices[0].message.content'
              echo "EOF"
            } >> $GITHUB_ENV
          else
            {
              echo "AI_TEST_SCENARIOS<<EOF"
              echo "AI test scenarios failed to generate"
              echo "EOF"
            } >> $GITHUB_ENV
          fi

      - name: Generate inline comments per file
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          echo "[]" > comments.json

          # Get changed files
          git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} | \
          while read -r filepath; do
            if [ -f "$filepath" ]; then
              # Get patch for this specific file
              patch=$(git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- "$filepath")
              
              if [ -n "$patch" ]; then
                patch_escaped=$(echo "$patch" | jq -Rs .)
                suggestions=$(curl -s https://api.openai.com/v1/chat/completions \
                  -H "Authorization: Bearer $OPENAI_API_KEY" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"model\":\"gpt-4o-mini\",
                    \"messages\":[
                      {\"role\":\"system\",\"content\":\"You are a code reviewer. For the provided diff patch, identify specific lines that need improvement and return a JSON array of objects with: path (string), line (number - the line number in the new version), side (always 'RIGHT'), and body (string - your review comment). Only include actionable feedback.\"},
                      {\"role\":\"user\",\"content\":$patch_escaped}
                    ],
                    \"max_tokens\":300,
                    \"temperature\":0.2
                  }")
                
                # Extract JSON response and validate
                if echo "$suggestions" | jq -e '.choices[0].message.content' > /dev/null 2>&1; then
                  response_content=$(echo "$suggestions" | jq -r '.choices[0].message.content')
                  # Try to parse as JSON array
                  if echo "$response_content" | jq -e 'type == "array"' > /dev/null 2>&1; then
                    # Update comments.json by merging the new comments
                    echo "$response_content" | jq --argjson existing "$(cat comments.json)" '$existing + .' > tmp_comments.json
                    mv tmp_comments.json comments.json
                  fi
                fi
              fi
            fi
          done

      - name: Post inline comments as PR review
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          comment_count=$(jq length comments.json)
          echo "Found $comment_count inline comments"

          if [ "$comment_count" -gt 0 ]; then
            # Create a review with inline comments
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
              -f body="🤖 **AI Code Review with Inline Comments**" \
              -f event="COMMENT" \
              -f comments="$(cat comments.json)" || echo "Failed to post inline comments"
          else
            echo "No inline comments to post."
          fi

      - name: Update PR description
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$PR_DESCRIPTION"

      - name: Post AI review summary comment
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          {
            echo "### 🤖 AI Code Review"
            echo "$AI_CODE_REVIEW"
            echo ""
            echo "---"
            echo ""
            echo "### 🧪 AI Test Scenarios"
            echo "$AI_TEST_SCENARIOS"
          } > comment_body.txt

          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file comment_body.txt
